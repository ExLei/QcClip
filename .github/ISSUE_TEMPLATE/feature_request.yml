name: 功能请求
description: 提出 QcClip 的新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索 [现有 Issues](https://github.com/mosheng1/QcClip/issues)，并查看 [项目说明](https://github.com/mosheng1/QcClip#readme) 中已支持的功能。
        一份 Issue 建议围绕一个需求展开，标题请简要描述希望新增或改进的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 当前使用中遇到了什么不便，希望解决什么问题？
      placeholder: "例如：整理多个项目的常用文本时，希望……"
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 请描述具体操作场景、使用频率和当前影响。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望新增什么功能或如何调整现有行为？不需要提供技术实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可说明现有功能或其他工具能否解决，以及仍然存在的不足。

  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - 与平台无关

  - type: textarea
    id: examples
    attributes:
      label: 参考示例与补充信息
      description: 可附其他工具的示例、界面草图或相关链接；若是希望恢复 QuickClipboard 的功能，请说明旧版功能和使用方式。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，确认没有相同的建议，或已说明本建议的区别。
          required: true
        - label: 我已查看 QcClip 当前支持的功能，并提供了具体的使用场景。
          required: true
