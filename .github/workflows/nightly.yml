name: 每夜构建发行版

# 计划任务只会运行默认分支（dev）上的工作流。
# 因此工作流放在 dev：先强制同步 fork 的 main 到上游 main，再构建并发布。
on:
  schedule:
    # 每天 03:00（Asia/Shanghai），即 19:00 UTC。
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_PANIC: abort
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'false'
  CMAKE_GENERATOR: Ninja
  UPSTREAM_REPOSITORY: mosheng1/QcClip
  NIGHTLY_TAG: nightly

defaults:
  run:
    shell: pwsh

jobs:
  sync:
    name: 同步上游 main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: 同步 fork main 到上游 main
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SYNC_DEPLOY_KEY: ${{ secrets.MAIN_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          upstream="$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" refs/heads/main | cut -f1)"
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]] || { echo "无效的上游提交：$upstream" >&2; exit 1; }
          echo "上游 main：$upstream"

          # 用仓库 deploy key（写权限）推送：GITHUB_TOKEN 是 GitHub App 令牌，没有
          # workflows 权限，推送或合并含 .github/workflows 改动的提交会被 422 拒绝。
          if [[ -z "${MAIN_SYNC_DEPLOY_KEY:-}" ]]; then
            echo "缺少仓库密钥 MAIN_SYNC_DEPLOY_KEY：请添加用于同步 main 的 deploy key（写权限）。" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$MAIN_SYNC_DEPLOY_KEY" > "$HOME/.ssh/main-sync"
          chmod 600 "$HOME/.ssh/main-sync"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/main-sync -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -C "$work" fetch -q --no-tags --depth=1 upstream main
          sha="$(git -C "$work" rev-parse FETCH_HEAD)"
          git -C "$work" push -q --force "ssh://git@github.com/${GITHUB_REPOSITORY}.git" "${sha}:refs/heads/main"

          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$actual" == "$sha" ]] || { echo "fork main 同步失败：$actual" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fork main -> $sha"

  build:
    name: 构建 Windows ${{ matrix.arch }}
    needs: sync
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc-arch: x64
            executable: target/release/QcClip.exe
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc-arch: amd64_arm64
            executable: target/aarch64-pc-windows-msvc/release/QcClip.exe
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_EXECUTABLE: ${{ matrix.executable }}

    steps:
      - name: 检出同步后的 main
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: 安装项目指定的 Rust 工具链
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw '安装项目 Rust 工具链失败' }
          rustup target add $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw "安装 Rust 目标失败：$env:BUILD_TARGET" }

      - name: 读取应用版本
        run: |
          $metadataJson = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { throw '读取 Cargo 元数据失败' }
          $metadata = ($metadataJson -join "`n") | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'QcClip' }
          if ($null -eq $package) { throw 'Cargo 元数据中找不到 QcClip 项目' }
          "APP_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 初始化打包工具的 x64 编译环境
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: 缓存 Cargo 构建及打包工具
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}

      - name: 安装打包工具
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          if ($LASTEXITCODE -ne 0) { throw '安装 cargo-packager 失败' }

      - name: 初始化目标架构的 MSVC 编译环境
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: 构建安装包和便携 ZIP
        env:
          QCCLIP_RELEASE_GUI: '1'
        run: ./scripts/package.ps1 -Arch $env:BUILD_ARCH -PackageType both

      - name: 验证发布程序不显示终端
        run: |
          $stream = [System.IO.File]::OpenRead($env:BUILD_EXECUTABLE)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550) { throw '发布程序不是有效的 PE 文件' }
            $stream.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "发布程序未使用 Windows GUI 子系统，当前值：$subsystem"
            }
          } finally {
            $stream.Dispose()
          }
          Write-Host '已确认发布程序使用 Windows GUI 子系统，不会显示终端窗口'

      - name: 校验安装包和便携包完整性
        run: |
          $directory = "target/packages/$env:BUILD_TARGET"
          $expected = @(
            "QcClip_$($env:APP_VERSION)_$($env:BUILD_ARCH)-setup.exe",
            "QcClip_$($env:APP_VERSION)_$($env:BUILD_ARCH)-portable.zip"
          )
          foreach ($name in $expected) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "缺少发布产物或文件为空：$path"
            }
          }

      - name: 保存当前架构发布产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/packages/${{ matrix.target }}/QcClip_*-setup.exe
            target/packages/${{ matrix.target }}/QcClip_*-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: 发布新版本
    needs:
      - sync
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载全部架构产物
        uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist

      - name: 删除旧发行版并发布新版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$NIGHTLY_TAG"
          built_at="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          title="QcClip $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"

          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} != 4 )); then
            echo "发布产物数量错误，预期 4 个，实际 ${#assets[@]} 个" >&2
            exit 1
          fi
          for arch in x64 arm64; do
            for suffix in setup.exe portable.zip; do
              matches=(dist/QcClip_*_${arch}-${suffix})
              if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
                echo "缺少或重复的发布产物：$arch / $suffix" >&2
                exit 1
              fi
            done
          done

          # 删除旧发行版及其 tag，再全新发布，保证 Releases 页面始终只有最新一次构建。
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$repo" --yes
          fi
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null
          fi

          gh api --method POST "repos/$repo/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$UPSTREAM_SHA" >/dev/null

          notes="$(cat <<EOF
          QcClip 自动构建（main）

          - 构建时间：$built_at
          - 上游提交：$UPSTREAM_SHA
          - 上游提交链接：https://github.com/$UPSTREAM_REPOSITORY/commit/$UPSTREAM_SHA
          - 工作流运行：https://github.com/$repo/actions/runs/$GITHUB_RUN_ID

          本发行版由定时构建自动生成，未经人工测试。
          EOF
          )"

          gh release create "$tag" --repo "$repo" --verify-tag --prerelease=false \
            --title "$title" --notes "$notes" "${assets[@]}"
