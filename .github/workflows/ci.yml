name: 检查代码格式

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt 格式检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装项目指定的 Rust 工具链
        run: |
          rustup show active-toolchain
          rustup component add rustfmt

      - name: 检查 rustfmt 格式
        # 不加 --all：vendor 下的 gpui 组件是独立的裁剪工作区，cargo metadata 无法加载。
        run: |
          cargo fmt --version
          cargo fmt --check
