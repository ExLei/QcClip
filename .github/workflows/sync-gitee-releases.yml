name: 同步 QcClip GitHub Releases 到 Gitee

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      reorder:
        description: '重建 Gitee Releases 顺序；会删除并重新创建所有 Gitee Release'
        required: false
        default: false
        type: boolean
      tag:
        description: '只同步指定版本标签，例如 v1.0.0-beta.4；留空则同步全部版本'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mosheng1/QcClip'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITEE_REPO: mk-mo-sheng/QcClip
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REORDER_RELEASES: ${{ inputs.reorder || false }}
      SYNC_TAG: ${{ inputs.tag || '' }}

    steps:
      - name: 检出完整标签历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 Gitee 令牌
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo '未配置 GITEE_TOKEN，请在仓库 Settings > Secrets and variables > Actions 中添加 Gitee 私人令牌。' >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 4 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 60 \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" \
            'https://gitee.com/api/v5/user')"
          if [[ "${status}" != '200' ]]; then
            echo "Gitee 令牌校验失败，HTTP 状态码：${status}" >&2
            exit 1
          fi

      - name: 推送发布标签到 Gitee
        shell: bash
        run: |
          set -euo pipefail
          remote="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ -n "${SYNC_TAG}" ]]; then
              git push --quiet "${remote}" \
                "refs/tags/${SYNC_TAG}:refs/tags/${SYNC_TAG}"
            else
              git push --quiet "${remote}" --tags
            fi
          elif [[ "${GITHUB_EVENT_NAME}" != 'release' || "${{ github.event.action }}" != 'deleted' ]]; then
            git push --quiet "${remote}" \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          fi

      - name: 同步发布说明和附件
        shell: bash
        run: python3 .github/scripts/sync-gitee-releases.py
