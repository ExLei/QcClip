[package]
name = "gpui_ce_windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/gpui_windows.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "8e36ac0921443f036bcc41f3f988a8285a734dc0", package = "gpui-ce", default-features = false }
gpui_render = { git = "https://github.com/gpui-ce/gpui-ce", rev = "8e36ac0921443f036bcc41f3f988a8285a734dc0", package = "gpui_ce_render" }
gpui_util = { git = "https://github.com/gpui-ce/gpui-ce", rev = "8e36ac0921443f036bcc41f3f988a8285a734dc0", package = "gpui_ce_util" }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit = "0.24.0"
accesskit_windows = "0.33.1"
anyhow = "1.0.100"
dunce = "1.0.5"
etagere = "0.2.15"
futures = "0.3.32"
collections = { git = "https://github.com/gpui-ce/gpui-ce", rev = "8e36ac0921443f036bcc41f3f988a8285a734dc0", package = "gpui_ce_collections" }
image = "0.25.10"
itertools = "0.14.0"
log = "0.4.29"
parking_lot = "0.12.5"
rand = "0.9.5"
raw-window-handle = "0.6.2"
smallvec = "1.15.1"
uuid = { version = "1.18.1", features = ["v4"] }
windows-061 = { package = "windows", version = "0.61.3", features = ["Win32_Graphics_Direct3D11"] }
windows = { version = "0.62.2", features = [
  "Foundation_Numerics",
  "Globalization_DateTimeFormatting",
  "Storage_Search",
  "Storage_Streams",
  "System_Threading",
  "UI_ViewManagement",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectManipulation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Hlsl",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_RestartManager",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media",
  "Data",
  "Data_Xml",
  "Data_Xml_Dom",
  "Win32_Storage_Packaging",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_JobObjects",
  "UI_Notifications",
] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-registry = "0.6.1"
